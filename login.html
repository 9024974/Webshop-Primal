<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login – PRIMAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,700;0,900;1,900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="navbar-placeholder"></div>

  <main>
    <section class="auth-page" aria-label="Inlogformulier">
      <div class="auth-box">

        <h1>Login</h1>
        <p>Enter your email and password to login</p>

        <input type="email"    id="email"    class="auth-input" placeholder="Email"    autocomplete="email"            aria-label="E-mailadres" required>
        <input type="password" id="password" class="auth-input" placeholder="Password" autocomplete="current-password" aria-label="Wachtwoord"  required>

        <p class="auth-err" id="err" role="alert"></p>

        <button class="btn-auth" onclick="handleLogin()">LOGIN</button>

        <p class="auth-switch">Don't have an account? <a href="signup.html">Sing up</a></p>

      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>

  <script src="script.js"></script>
  <script src="components.js"></script>
  <script>

    function handleLogin() {
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const err      = document.getElementById('err');
      err.classList.remove('show');

      if (!email || !password) {
        err.textContent = 'Vul alle velden in.';
        err.classList.add('show');
        return;
      }

      const users = lsGet('primal_users', []);
      const user  = users.find(u => u.email === email && u.password === password);

      if (!user) {
        err.textContent = 'Onjuist e-mailadres of wachtwoord.';
        err.classList.add('show');
        return;
      }

      lsSet('primal_current_user', email);
      window.location.href = 'index.html';
    }

    document.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });

    document.addEventListener('DOMContentLoaded', () => {
      injectNavbar('login');
      injectFooter();
      updateNavAuth();
      updateCartBadge();
      initMobileMenu();
      if (getCurrentUser()) window.location.href = 'index.html';
    });
  </script>
</body>
</html>
