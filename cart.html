<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Cart – PRIMAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,700;0,900;1,900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="navbar-placeholder"></div>

  <main>
    <div class="cart-wrap">

      <h1 class="cart-heading">Shopping Cart</h1>

      <div>
        <div class="cart-head" role="row">
          <span>Item</span>
          <span>Qty</span>
          <span>Subtotal</span>
          <span></span>
        </div>

        <div id="cart-items"></div>

        <a href="shop.html" class="btn-continue" aria-label="Verder winkelen">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
          Continue Shopping
        </a>
      </div>

      <div class="cart-summary" aria-label="Besteloverzicht">
        <h2>Summary</h2>

        <div class="sum-row">
          <span>Subtotal</span>
          <span id="sum-sub">€0,00</span>
        </div>

        <div class="sum-row">
          <span>Shipping Cost</span>
          <span>€5,00</span>
        </div>

        <div class="sum-row sum-row--total">
          <span>Total</span>
          <span id="sum-total">€5,00</span>
        </div>

        <button class="btn-checkout" onclick="showToast('Checkout binnenkort beschikbaar!')">
          Checkout
        </button>
      </div>

    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="script.js"></script>
  <script src="components.js"></script>
  <script>
    const SHIP = 5; 

    function fmt(n) {
      return `€${n.toFixed(2).replace('.', ',')}`;
    }

    function renderCart() {
      const cart = getCart();
      const container = document.getElementById('cart-items');
      container.innerHTML = '';

      if (cart.length === 0) {
        container.innerHTML = `
          <div class="cart-empty">
            <p>Je winkelmandje is leeg.</p>
            <a href="shop.html">Bekijk producten</a>
          </div>`;
        document.getElementById('sum-sub').textContent   = '€0,00';
        document.getElementById('sum-total').textContent = fmt(SHIP);
        return;
      }

      let subtotal = 0;

      cart.forEach((item, i) => {
        const rowTotal = item.price * item.qty;
        subtotal += rowTotal;

        const fullName = item.color
          ? `${item.name} – ${item.color}`.toUpperCase()
          : item.name.toUpperCase();

        const row = document.createElement('div');
        row.className = 'cart-row';
        row.setAttribute('role', 'row');
        row.innerHTML = `
          <!-- Productafbeelding -->
          <div class="cart-row__img">
            <img src="${item.image}" alt="${item.name}" loading="lazy"
                 onerror="this.src='https://placehold.co/90x90/f5f5f5/aaa?text=IMG'">
          </div>
          <!-- Naam + maat -->
          <div>
            <p class="cart-row__name">${fullName}</p>
            <p class="cart-row__size">Size ${item.size}</p>
          </div>
          <!-- Aantal -->
          <div class="cart-row__qty">${item.qty}</div>
          <!-- Subtotaal -->
          <div class="cart-row__sub">€${rowTotal}</div>
          <!-- Verwijderknop -->
          <button class="cart-row__rm" onclick="removeItem(${i})" aria-label="${item.name} verwijderen">×</button>
        `;
        container.appendChild(row);
      });

      document.getElementById('sum-sub').textContent   = fmt(subtotal);
      document.getElementById('sum-total').textContent = fmt(subtotal + SHIP);
    }

    function removeItem(index) {
      removeFromCart(index);
      renderCart();
    }

    document.addEventListener('DOMContentLoaded', () => {
      injectNavbar('');
      injectFooter();
      updateNavAuth();
      updateCartBadge();
      initMobileMenu();
      renderCart();
    });
  </script>
</body>
</html>
