<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product – PRIMAL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,700;0,900;1,900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="navbar-placeholder"></div>

  <main>
    <section class="detail-wrap" id="detail-wrap" aria-label="Productdetail">
      <p style="padding:20px;color:#999;grid-column:1/-1;">Product laden...</p>
    </section>
  </main>

  <div id="footer-placeholder"></div>

  <script src="script.js"></script>
  <script src="components.js"></script>
  <script>
    let currentProduct = null;
    let selectedSize   = null;

    function selectThumb(index) {
      const thumbs = document.querySelectorAll('.thumb');
      const src = thumbs[index].querySelector('img').src;
      document.getElementById('main-img').src = src;
      thumbs.forEach((el, i) => el.classList.toggle('active', i === index));
    }

    function selectSize(size) {
      selectedSize = size;
      document.querySelectorAll('.size-btn').forEach(btn => {
        btn.classList.toggle('selected', btn.dataset.size === size);
      });
    }

    function handleAddToCart() {
      if (!selectedSize) {
        showToast('Selecteer eerst een maat.');
        return;
      }
      addToCart(currentProduct, selectedSize);
      showToast(`${currentProduct.name} (${selectedSize}) toegevoegd aan winkelmandje!`);
    }

    function getImages(product) {
      if (product.images && product.images.length > 0) {
        return product.images;
      }
      return [product.image, product.image, product.image, product.image];
    }

    function renderDetail(product) {
      currentProduct = product;
      const section = document.getElementById('detail-wrap');
      const images  = getImages(product);
      const fullName = product.color
        ? `${product.name} – ${product.color}`.toUpperCase()
        : product.name.toUpperCase();

      section.innerHTML = `
        <!-- Thumbnail kolom (links) -->
        <div class="detail-thumbs" role="list" aria-label="Productafbeeldingen">
          ${images.map((img, i) => `
            <div class="thumb ${i === 0 ? 'active' : ''}" role="listitem"
                 onclick="selectThumb(${i})"
                 aria-label="Thumbnail ${i + 1}">
              <img src="${img}" alt="${product.name} afbeelding ${i + 1}" loading="lazy"
                   onerror="this.src='https://placehold.co/100x100/f5f5f5/aaa?text=IMG'">
            </div>
          `).join('')}
        </div>

        <!-- Hoofdafbeelding (midden) -->
        <div class="detail-main-img">
          <img id="main-img" src="${images[0]}" alt="${fullName}"
               onerror="this.src='https://placehold.co/600x530/f5f5f5/aaa?text=No+Image'">
        </div>

        <!-- Productinformatie (rechts) -->
        <div class="detail-info">
          <h1>${fullName}</h1>
          <p class="desc">${product.description}</p>

          <!-- Prijs in rood -->
          <div class="detail-price">€${product.price}</div>

          <!-- Maat selecteren -->
          <p class="size-title">Size</p>
          <div class="size-row" role="group" aria-label="Maat kiezen">
            ${product.sizes.map(s => `
              <button class="size-btn" data-size="${s}"
                      onclick="selectSize('${s}')" aria-label="Maat ${s}">
                ${s}
              </button>
            `).join('')}
          </div>

          <!-- Add to Cart knop -->
          <button class="btn-cart" onclick="handleAddToCart()" aria-label="Toevoegen aan winkelmandje">
            ADD TO CART
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
              <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
            </svg>
          </button>
        </div>
      `;

      document.title = `${product.name} – PRIMAL`;
    }

    document.addEventListener('DOMContentLoaded', async () => {
      injectNavbar('shop');
      injectFooter();
      updateNavAuth();
      updateCartBadge();
      initMobileMenu();

      const id = parseInt(new URLSearchParams(window.location.search).get('id'));
      if (!id) { window.location.href = 'shop.html'; return; }

      const products = await loadAllProducts();
      const product  = products.find(p => p.id === id);

      if (!product) {
        document.getElementById('detail-wrap').innerHTML =
          '<p style="padding:40px;color:#999;grid-column:1/-1;">Product niet gevonden. <a href="shop.html" style="color:var(--red)">Terug naar shop</a></p>';
        return;
      }

      renderDetail(product);
    });
  </script>
</body>
</html>
