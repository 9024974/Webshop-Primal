<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Product – PRIMAL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,700;0,900;1,900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="navbar-placeholder"></div>

  <main>
    <section class="addprod-page" aria-label="Product toevoegen">
      <div class="addprod-box">

        <h1>Add product</h1>

        <div class="form-group">
          <label for="prod-name" class="form-label">Product name</label>
          <input type="text" id="prod-name" class="form-input" placeholder="bijv. Star Hoodie" aria-label="Productnaam" required>
        </div>

        <div class="form-group">
          <label for="prod-desc" class="form-label">Product description</label>
          <textarea id="prod-desc" class="form-input" placeholder="Omschrijf het product..." aria-label="Productomschrijving" required></textarea>
        </div>

        <div class="form-group">
          <label for="prod-price" class="form-label">Product price in euros</label>
          <input type="number" id="prod-price" class="form-input" placeholder="bijv. 69" min="1" step="1" aria-label="Prijs in euro" required>
        </div>

        <div class="form-group">
          <label class="form-label">Primary image</label>

          <label for="file-input" class="img-upload-label">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
            Add image
          </label>
          <input type="file" id="file-input" accept="image/*" onchange="onFileSelect(event)">

          <input type="url" id="img-url" class="form-input img-url-input"
                 placeholder="Of plak een afbeelding-URL"
                 aria-label="Afbeelding URL"
                 oninput="onUrlInput()">

          <img id="img-preview" src="" alt="Voorvertoning afbeelding">
        </div>

        <p class="form-err" id="form-err" role="alert"></p>

        <button class="btn-addprod" onclick="handleAddProduct()">ADD PRODUCT</button>

        <p class="form-ok" id="form-ok" role="status">Product succesvol toegevoegd! Je wordt doorgestuurd naar de shop...</p>

      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>

  <script src="script.js"></script>
  <script src="components.js"></script>
  <script>
    let imageData = null; 

    function onFileSelect(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        imageData = ev.target.result;
        showPreview(imageData);
        document.getElementById('img-url').value = '';
      };
      reader.readAsDataURL(file);
    }

    function onUrlInput() {
      const url = document.getElementById('img-url').value.trim();
      imageData = url || null;
      if (url) showPreview(url);
      else document.getElementById('img-preview').style.display = 'none';
    }

    function showPreview(src) {
      const el = document.getElementById('img-preview');
      el.src = src;
      el.style.display = 'block';
      el.onerror = () => { el.style.display = 'none'; showToast('Afbeelding kon niet worden geladen.'); };
    }

    function handleAddProduct() {
      const name  = document.getElementById('prod-name').value.trim();
      const desc  = document.getElementById('prod-desc').value.trim();
      const price = parseFloat(document.getElementById('prod-price').value);
      const errEl = document.getElementById('form-err');
      const okEl  = document.getElementById('form-ok');

      errEl.classList.remove('show');
      okEl.classList.remove('show');

      if (!name)             { errEl.textContent = 'Voer een productnaam in.';   errEl.classList.add('show'); return; }
      if (!desc)             { errEl.textContent = 'Voer een omschrijving in.'; errEl.classList.add('show'); return; }
      if (!price || price<1) { errEl.textContent = 'Voer een geldige prijs in.'; errEl.classList.add('show'); return; }

      const image = imageData ||
        `https://placehold.co/600x800/f5f5f5/aaa?text=${encodeURIComponent(name)}`;

      const userProds = lsGet('primal_user_products', []);
      const maxId     = userProds.reduce((m, p) => Math.max(m, p.id), 100);

      const newProd = {
        id:          maxId + 1,
        name:        name,
        color:       '',
        price:       price,
        image:       image,
        description: desc,
        category:    'other',
        sizes:       ['S', 'M', 'L', 'XL'],
        addedAt:     Date.now() 
      };

      userProds.push(newProd);
      lsSet('primal_user_products', userProds);

      okEl.classList.add('show');
      setTimeout(() => { window.location.href = 'shop.html'; }, 1500);
    }

    document.addEventListener('DOMContentLoaded', () => {
      injectNavbar('');
      injectFooter();
      updateNavAuth();
      updateCartBadge();
      initMobileMenu();

      if (!getCurrentUser()) {
        window.location.href = 'login.html';
      }
    });
  </script>
</body>
</html>
