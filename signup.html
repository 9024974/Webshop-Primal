<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up – PRIMAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,700;0,900;1,900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="navbar-placeholder"></div>

  <main>
    <section class="auth-page" aria-label="Registratieformulier">
      <div class="auth-box">

        <h1>Sign Up</h1>
        <p>Enter your email and password to sign up</p>

        <input type="email"    id="email"    class="auth-input" placeholder="Email"    autocomplete="email"       aria-label="E-mailadres" required>
        <input type="password" id="password" class="auth-input" placeholder="Password" autocomplete="new-password" aria-label="Wachtwoord"  required>

        <p class="auth-err" id="err" role="alert"></p>

        <button class="btn-auth" onclick="handleSignUp()">SIGN UP</button>

        <p class="auth-switch">Already have an account? <a href="login.html">Login</a></p>

      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>

  <script src="script.js"></script>
  <script src="components.js"></script>
  <script>

    function handleSignUp() {
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const err      = document.getElementById('err');
      err.classList.remove('show');

      if (!email || !password) {
        err.textContent = 'Vul alle velden in.';
        err.classList.add('show');
        return;
      }
      if (!email.includes('@') || !email.includes('.')) {
        err.textContent = 'Voer een geldig e-mailadres in.';
        err.classList.add('show');
        return;
      }
      if (password.length < 6) {
        err.textContent = 'Wachtwoord moet minimaal 6 tekens bevatten.';
        err.classList.add('show');
        return;
      }

      const users = lsGet('primal_users', []);

      if (users.some(u => u.email === email)) {
        err.textContent = 'Dit e-mailadres is al geregistreerd.';
        err.classList.add('show');
        return;
      }

      users.push({ email, password });
      lsSet('primal_users', users);

      showToast('Account aangemaakt! Je wordt doorgestuurd naar de loginpagina.');
      setTimeout(() => { window.location.href = 'login.html'; }, 1200);
    }

    document.addEventListener('keydown', e => { if (e.key === 'Enter') handleSignUp(); });

    document.addEventListener('DOMContentLoaded', () => {
      injectNavbar('');
      injectFooter();
      updateNavAuth();
      updateCartBadge();
      initMobileMenu();
      if (getCurrentUser()) window.location.href = 'index.html';
    });
  </script>
</body>
</html>
